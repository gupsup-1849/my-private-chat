<!DOCTYPE html>
<html>
<head>
    <title>Private Chat & Walkie-Talkie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <div class="controls">
            <input id="messageInput" placeholder="Type a message...">
            <button id="sendBtn">Send</button>
            <button id="walkieBtn">🎤</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const msgInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');
        const walkieBtn = document.getElementById('walkieBtn');
        const remoteAudio = document.getElementById('remoteAudio');

        // --- Text Chat Logic ---
        sendBtn.onclick = () => {
            const msg = msgInput.value;
            if(msg) {
                socket.emit('chat message', msg);
                msgInput.value = '';
            }
        };

        socket.on('chat message', (msg) => {
            const item = document.createElement('div');
            item.textContent = msg;
            messagesDiv.appendChild(item);
        });

        // --- Walkie-Talkie Logic ---
        let mediaRecorder;

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = event => {
                socket.emit('voice-stream', event.data);
            };

            walkieBtn.onmousedown = () => {
                mediaRecorder.start();
                walkieBtn.style.background = "#2ecc71"; // Green while speaking
            };

            walkieBtn.onmouseup = () => {
                mediaRecorder.stop();
                walkieBtn.style.background = "#e74c3c"; // Red back
            };
        }).catch(err => console.error("Mic access denied:", err));

        socket.on('voice-stream', (data) => {
            const audioBlob = new Blob([data], { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            remoteAudio.src = audioUrl;
        });
    </script>
</body>
</html>
