<!DOCTYPE html>
<html>
<head>
    <title>GupShup Pro: Call & Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-container" style="display:none;">
        <div class="header">
            <h2 id="room-title">Private Room 🔒</h2>
            <button onclick="changeMyName()" id="settingsBtn">⚙️ Change Name</button>
        </div>
        
        <div id="messages"></div>

        <div class="controls">
            <input id="messageInput" placeholder="Type message...">
            <button id="sendBtn">Send</button>
            <button id="walkieBtn" class="mic-off">🎤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const SECRET_CODE = "1234"; 
        let userPass = prompt("Enter Secret Code:");

        if (userPass === SECRET_CODE) {
            let myName = localStorage.getItem("chatName") || prompt("Apna naam likhiye:") || "User";
            localStorage.setItem("chatName", myName);
            
            document.getElementById('chat-container').style.display = 'block';
            const socket = io();
            const messagesDiv = document.getElementById('messages');
            const walkieBtn = document.getElementById('walkieBtn');

            // --- NAME CHANGE FUNCTION ---
            window.changeMyName = () => {
                let newName = prompt("Naya naam likhiye:", myName);
                if(newName) {
                    myName = newName;
                    localStorage.setItem("chatName", myName);
                    alert("Naam badal gaya: " + myName);
                }
            };

            // --- FAST CHAT ---
            document.getElementById('sendBtn').onclick = () => {
                const msg = document.getElementById('messageInput').value;
                if(msg.trim()) {
                    socket.emit('chat message', { user: myName, text: msg });
                    document.getElementById('messageInput').value = '';
                }
            };

            socket.on('chat message', (data) => {
                const item = document.createElement('div');
                item.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
                messagesDiv.appendChild(item);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            // --- REAL-TIME VOICE (CALL MODE) ---
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let isCalling = false;

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const source = audioCtx.createMediaStreamSource(stream);
                const processor = audioCtx.createScriptProcessor(4096, 1, 1);

                source.connect(processor);
                processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    if (isCalling) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        socket.emit('voice-data', inputData); // Raw data bhej raha hai (Super Fast)
                    }
                };

                walkieBtn.onclick = () => {
                    isCalling = !isCalling;
                    walkieBtn.className = isCalling ? "mic-on" : "mic-off";
                    walkieBtn.innerText = isCalling ? "🔊 ON" : "🎤 OFF";
                    if(audioCtx.state === 'suspended') audioCtx.resume();
                };
            });

            socket.on('voice-data', (data) => {
                // Dusre phone par turant play karne ke liye
                const buffer = audioCtx.createBuffer(1, data.length, audioCtx.sampleRate);
                buffer.getChannelData(0).set(data);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start();
            });

        } else {
            alert("Wrong Code!");
            window.location.reload();
        }
    </script>
</body>
</html>
