<!DOCTYPE html>
<html>
<head>
    <title>Private Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="main-container">
        <div id="setup-box">
            <h1>🔒 Private Crypt</h1>
            <input type="text" id="userInput" placeholder="Your Name">
            <input type="text" id="roomInput" placeholder="Room ID">
            <input type="password" id="keyInput" placeholder="Secret Key">
            <button onclick="joinRoom()">Enter Chat</button>
        </div>

        <div id="chat-box" style="display:none;">
            <div id="message-area"></div>
            <div class="input-row">
                <input type="text" id="msgInput" placeholder="Type message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName, currentRoom, secretKey;

        function joinRoom() {
            myName = document.getElementById('userInput').value;
            currentRoom = document.getElementById('roomInput').value;
            secretKey = document.getElementById('keyInput').value;

            if (myName && currentRoom && secretKey) {
                socket.emit('join-room', currentRoom);
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('chat-box').style.display = 'block';
            }
        }

        function sendMessage() {
            const text = document.getElementById('msgInput').value;
            if (!text) return;
            const encrypted = CryptoJS.AES.encrypt(text, secretKey).toString();
            socket.emit('private-message', { room: currentRoom, msg: encrypted, sender: myName });
            document.getElementById('msgInput').value = '';
        }

        socket.on('chat-message', (data) => {
            const bytes = CryptoJS.AES.decrypt(data.msg, secretKey);
            const decText = bytes.toString(CryptoJS.enc.Utf8);
            const div = document.createElement('div');
            // Check: Mera message hai ya kisi aur ka?
            div.className = (data.sender === myName) ? 'msg-bubble my-msg' : 'msg-bubble other-msg';
            div.innerHTML = `<small>${data.sender}</small><br>${decText || "[Error: Wrong Key]"}`;
            document.getElementById('message-area').appendChild(div);
            document.getElementById('message-area').scrollTop = document.getElementById('message-area').scrollHeight;
        });
    </script>
</body>
</html>
